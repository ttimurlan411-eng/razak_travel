name: razak_travel
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # =========================
  # BASIC PACKAGES
  # =========================
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.1
  uuid: ^4.5.1

  # =========================
  # SUPABASE
  # =========================
  supabase_flutter: ^2.8.0

  # =========================
  # PAYMENT / MAPS
  # =========================
  flutter_stripe: ^12.6.0
  google_maps_flutter: ^2.17.0
  pdf: ^3.11.1
  printing: ^5.13.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/image/icon.png
    - assets/image/logo.png

# =========================
# SPLASH SCREEN CONFIG
# =========================
flutter_native_splash:
  color: "#ffffff"
  image: assets/image/logo.png
  android: true
  ios: true

# =========================
# APP ICON CONFIG
# =========================
flutter_icons:
  android: true
  ios: true
  image_path: "assets/image/icon.png"
